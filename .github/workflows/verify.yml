name: Verify local adapter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify-vendor
      - run: npm test
      - run: npm run test:browser
      - name: Verify standalone shared skill installation
        run: node scripts/smoke-skills.mjs --source "${{ github.workspace }}"
