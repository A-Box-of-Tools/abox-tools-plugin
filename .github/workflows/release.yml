name: Build and release local bundles

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Bundle ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            platform: win32
            arch: x64
          - os: ubuntu-latest
            label: linux-x64
            platform: linux
            arch: x64
          - os: macos-latest
            label: macos-arm64
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            label: macos-x64
            platform: darwin
            arch: x64
    env:
      ABOX_EXPECT_PLATFORM: ${{ matrix.platform }}
      ABOX_EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify-vendor
      - run: npm test
      - run: npm run package:release
      - run: npm run smoke:release
      - uses: actions/upload-artifact@v7
        with:
          name: abox-tools-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  universal:
    name: Assemble universal MCPB
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 tests/universal-package.test.py
      - uses: actions/download-artifact@v8
        with:
          pattern: abox-tools-*
          path: release
          merge-multiple: true
      - run: npm run package:universal
      - uses: actions/upload-artifact@v7
        with:
          name: abox-tools-universal
          path: release/*-universal.mcpb*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  smoke-universal:
    name: Verify universal on ${{ matrix.label }}
    needs: universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            platform: win32
            arch: x64
          - os: ubuntu-latest
            label: linux-x64
            platform: linux
            arch: x64
          - os: macos-latest
            label: macos-arm64
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            label: macos-x64
            platform: darwin
            arch: x64
    env:
      ABOX_EXPECT_PLATFORM: ${{ matrix.platform }}
      ABOX_EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: abox-tools-universal
          path: release
      - run: npm run smoke:universal

  publish:
    name: Publish verified tag
    needs: [build, universal, smoke-universal]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: abox-tools-*
          path: release
          merge-multiple: true
      - name: Publish all verified native and universal bundles
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  register-mcp:
    name: Register the published universal MCPB
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp.yml
    with:
      tag: ${{ github.ref_name }}
